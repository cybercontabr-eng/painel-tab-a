name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.x'
          cache: true

      - name: Gerar projeto Android
        run: |
          mkdir -p /tmp/keep
          cp -r lib pubspec.yaml /tmp/keep/
          flutter create --platforms=android --org br.com.painel --project-name painel_tab .
          rm -rf lib test
          cp -r /tmp/keep/lib lib
          cp /tmp/keep/pubspec.yaml pubspec.yaml
          python3 tool/patch_android.py

      - name: Assinatura fixa (permite atualizar sem desinstalar)
        run: |
          mkdir -p ~/.android
          cp tool/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: Analisar
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compilar APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: painel-tab-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk painel-tab.apk
          gh release create "v1.0.${{ github.run_number }}" painel-tab.apk \
            --title "Painel Tab v1.0.${{ github.run_number }}" \
            --notes "APK gerado automaticamente a partir do commit ${{ github.sha }}."
