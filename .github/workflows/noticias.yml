name: Notícias do painel
on:
  schedule:
    - cron: '17 10,14,18,22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: noticias
jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: main }
      - uses: actions/checkout@v4
        with: { ref: gh-pages, path: site }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python main/.github/scripts/noticias.py site
      - name: Publicar
        working-directory: site
        run: |
          git config user.name "painel-bot"
          git config user.email "painel-bot@users.noreply.github.com"
          git add -A noticias.json nt
          git diff --cached --quiet && echo "nada a publicar" && exit 0
          git commit -m "Notícias atualizadas"
          git push
